# Decap CMS — el panel que escribe las entradas del blog en el repositorio.
#
# Cada entrada que publiques acá se guarda como archivo Markdown en
# contenido/blog/, la acción de GitHub la convierte en HTML, y queda como
# una página real que los buscadores y los motores de IA pueden leer.

# Este panel se usa SOLO en tu computador. La carpeta empieza con guion
# bajo, así que GitHub Pages no la publica: nadie en internet la alcanza.
#
# En modo local, Decap escribe directamente en tu repositorio de trabajo.
# No hace falta OAuth, ni proxy, ni worker: escribes, revisas, y subes con
# git cuando estés conforme.
local_backend: true

backend:
  name: git-gateway
  branch: main

# Las imágenes que subas desde el panel van a la misma carpeta que el resto.
media_folder: "img_webp"
public_folder: "/img_webp"

locale: "es"

collections:
  - name: "blog"
    label: "Entradas del blog"
    label_singular: "Entrada"
    folder: "contenido/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{fecha}} — {{titulo}}"
    sortable_fields: ['fecha', 'titulo']
    fields:
      - label: "Título"
        name: "titulo"
        widget: "string"
        hint: "El que se ve grande arriba y el que aparece en Google."

      - label: "Fecha"
        name: "fecha"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: false

      - label: "Resumen"
        name: "resumen"
        widget: "text"
        required: false
        hint: "Dos líneas. Es lo que Google muestra debajo del título. Si lo dejas vacío se toma el principio del texto."

      - label: "Imagen de portada"
        name: "imagen"
        widget: "image"
        required: false
        hint: "La que se ve al compartir el enlace por WhatsApp o Instagram."

      - label: "Borrador"
        name: "borrador"
        widget: "boolean"
        default: false
        required: false
        hint: "Si está activado, la entrada NO se publica. Sirve para dejarla a medias."

      - label: "Texto"
        name: "body"
        widget: "markdown"
